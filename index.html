<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Brownie Clicker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&display=swap">
<style>
:root{--g:#f5c542;--t:#f3e3d0;--m:#a98c75;box-sizing:border-box}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#120a07;color:var(--t);font-family:Merriweather,Georgia,serif;color-scheme:dark;overflow:hidden}
button{font:inherit;color:inherit}
#app{display:grid;grid-template-columns:minmax(300px,34%) 1fr minmax(300px,30%);height:100vh;height:100dvh;padding-top:env(safe-area-inset-top,0px)}
.col{overflow:auto;position:relative;min-height:0}
#cL{background:radial-gradient(ellipse at 50% 38%,#5a3220 0,#341a10 45%,#1a0d08 100%);border-right:3px solid #0c0605;box-shadow:inset -8px 0 18px #0009;display:flex;flex-direction:column;align-items:center;padding:0 0 14px}
#cL:after{content:"";position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(#0000,#2b150b 60%,#3b1d0d);pointer-events:none;border-top:2px solid #5a301a33}
#cL>*{position:relative;z-index:1}
#bakery{width:100%;text-align:center;padding:8px;font-weight:900;font-size:16px;background:linear-gradient(#4a2a1a,#2a1409);border-bottom:2px solid #0c0605;box-shadow:0 2px 8px #0008;color:#ffe9c9;text-shadow:0 2px 3px #000}
#bankbox{margin:10px 0 0;width:88%;text-align:center;background:#0009;border:1px solid #6d4025;border-radius:6px;padding:8px 6px;box-shadow:0 0 14px #000a inset}
#bank{font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 0 #000,0 0 14px #f5c54266;line-height:1.15}
#cps{font-size:12px;color:#e6cbb0;margin-top:2px}
#buffs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:26px;margin:6px 8px 0}
.buff{background:linear-gradient(#6b4300,#3d2500);border:1px solid var(--g);border-radius:6px;padding:2px 10px;font-size:12px}
#stage{position:relative;display:flex;justify-content:center;align-items:center;width:100%;flex:1;min-height:300px;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#stage:before{content:"";position:absolute;width:420px;height:420px;max-width:120%;background:repeating-conic-gradient(#f5c54226 0 10deg,#0000 10deg 30deg);border-radius:50%;-webkit-mask:radial-gradient(circle,#000 20%,#0000 68%);mask:radial-gradient(circle,#000 20%,#0000 68%);animation:spin 60s linear infinite;pointer-events:none}
@keyframes spin{to{transform:rotate(360deg)}}
#brownie{position:relative;width:290px;height:270px;border:0;padding:0;background:none;cursor:pointer;filter:drop-shadow(0 10px 18px #000a) drop-shadow(0 0 26px #f5c54233);animation:float 4s ease-in-out infinite;transition:transform .06s}
#brownie:hover{filter:brightness(1.1)}
#brownie:active{transform:scale(.94);animation:none}
@keyframes float{50%{transform:translateY(-6px) rotate(1deg)}}
.pop{position:absolute;pointer-events:none;font-weight:900;color:#fff;text-shadow:0 2px 3px #000,0 0 8px #000;animation:up 1s forwards;z-index:5;white-space:nowrap}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.crumb{position:absolute;pointer-events:none;width:8px;height:8px;border-radius:2px;background:#6b3a22;animation:fall .8s forwards;z-index:4}
@keyframes fall{to{transform:translate(var(--x),var(--y)) rotate(200deg);opacity:0}}
#gold{position:fixed;z-index:50;font-size:64px;border:0;background:none;cursor:pointer;display:none;filter:drop-shadow(0 0 14px gold);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
#ctl{text-align:center;padding:0 8px}
.btn{background:linear-gradient(#ffe08a,#c8921a);color:#2a1710;font-weight:900;border:1px solid #6b4300;border-radius:5px;padding:7px 11px;cursor:pointer;margin:3px 2px;font-size:13px;box-shadow:0 2px 0 #4a2d00}
.btn:active{transform:translateY(1px)}
.btn.s{background:linear-gradient(#5a3624,#3a2014);color:var(--t);border:1px solid #7a4a2c;box-shadow:0 2px 0 #0008;font-weight:700}
#sv{color:#d9bda3;font-size:11px;margin-top:4px;text-shadow:0 1px 1px #000}
textarea{width:100%;height:56px;background:#1b0f0a;color:var(--t);border:1px solid #5a3624;border-radius:6px;font-size:11px}
#cX{background:linear-gradient(#2a1810,#1a0e09);padding:0 0 12px}
#menu{display:flex;position:sticky;top:0;z-index:3;background:linear-gradient(#5a3624,#2b170d);border-bottom:2px solid #0c0605}
#menu span{flex:1;text-align:center;padding:9px 2px;font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;border-right:1px solid #0c0605;color:#f0d7bb;text-shadow:0 1px 2px #000}
#news{margin:8px;padding:7px 10px;background:#0a0503;border:1px solid #4a2a1a;border-radius:4px;font-style:italic;font-size:12px;color:#e8d3bb;min-height:34px;box-shadow:inset 0 0 10px #000}
.box{margin:8px;background:#00000040;border:1px solid #4a2a1a;border-radius:6px;padding:10px}
h2{margin:0 0 8px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--g);font-weight:900;border-bottom:1px solid #4a2a1a;padding-bottom:5px}
#ach{display:flex;flex-wrap:wrap;gap:4px}
.a{width:36px;height:36px;border-radius:5px;background:#120a06;display:flex;align-items:center;justify-content:center;font-size:19px;opacity:.28;border:1px solid #3b2218;filter:grayscale(1)}
.a.on{opacity:1;filter:none;border-color:var(--g);background:linear-gradient(#4a2a1a,#2a1409)}
#stats div{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;border-bottom:1px dotted #4a2a1a}
#stats span:last-child{color:#ffe9c9;font-weight:700}
#cS{background:linear-gradient(#2b1409,#150a06);border-left:3px solid #0c0605;box-shadow:inset 8px 0 18px #0009}
#storehd{position:sticky;top:0;z-index:3;text-align:center;padding:8px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:#ffe9c9;background:linear-gradient(#6b2f1c,#3a160c);border-bottom:2px solid #0c0605;text-shadow:0 2px 2px #000}
#upbox{background:#0006;border-bottom:2px solid #0c0605;padding:8px;min-height:62px;box-shadow:inset 0 0 12px #000}
#ups{display:flex;flex-wrap:wrap;gap:3px}
.up{width:46px;height:46px;border-radius:4px;border:2px solid #9a6a3a;background:radial-gradient(circle at 35% 30%,#6b3a22,#2a1208);font-size:24px;cursor:pointer;padding:0;box-shadow:0 2px 3px #000a;transition:transform .08s}
.up:hover{border-color:var(--g);transform:scale(1.08)}
.up.no{filter:grayscale(.7) brightness(.65);border-color:#4a2a1a}
#shop{padding:0}
.row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:linear-gradient(90deg,#3a1d12,#24120a);border:0;border-bottom:1px solid #0c0605;border-top:1px solid #ffffff12;padding:7px 10px;cursor:pointer;min-height:62px;position:relative}
.row:hover{background:linear-gradient(90deg,#5a2f1c,#33190e)}
.row.no{opacity:1}.row.no .n b{color:#bba58f}.row.no .c{color:#ff6b5a}
.row .i{font-size:30px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle,#6b3a22,#1f0e07);border:2px solid #7a4a2c;border-radius:6px;flex:none}
.row .n{flex:1;min-width:0}.row .n b{display:block;font-size:16px;color:#fff;text-shadow:0 2px 2px #000}
.row small{color:#bda58e;font-size:10px;display:block}
.row .c{color:#7dff7d;font-weight:900;font-size:13px;text-shadow:0 1px 1px #000}
.row .o{font-size:34px;font-weight:900;color:#ffffff40;min-width:34px;text-align:right}
#toast{position:fixed;left:50%;bottom:calc(60px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:linear-gradient(#ffe08a,#c8921a);color:#2a1710;padding:8px 16px;border-radius:6px;font-weight:900;opacity:0;transition:opacity .3s;z-index:99;pointer-events:none;max-width:90vw;text-align:center;border:1px solid #6b4300;font-size:13px}
#tip{position:fixed;z-index:60;background:linear-gradient(#2a1409,#120a06);border:2px solid #9a6a3a;border-radius:6px;padding:8px 12px;font-size:12px;pointer-events:none;display:none;max-width:250px;box-shadow:0 6px 16px #000c}
.tabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:40;background:#0c0605;border-top:2px solid #5a3624;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;padding:12px 4px;background:linear-gradient(#3a2014,#1f0e07);border:0;border-right:1px solid #0c0605;font-weight:900;font-size:13px}
.tabs button.on{background:linear-gradient(#ffe08a,#c8921a);color:#2a1710}
@media(max-width:900px){#app{grid-template-columns:1fr;display:block;height:100dvh}.col{height:calc(100dvh - 50px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}.tabs{display:flex}.col[data-t]{display:none}.col[data-t].on{display:block}#cL.on{display:flex}#stage{min-height:300px}#brownie{width:250px;height:235px}}
#upbox{max-height:230px;overflow:auto}
#band{width:92%;max-height:200px;overflow:auto;margin:4px 0 8px;border:1px solid #4a2a1a;border-radius:6px;background:#0b0604aa}
.brow{display:flex;align-items:center;min-height:30px;padding:2px 6px;border-bottom:1px solid #2a1409;background:linear-gradient(90deg,#3a1d12aa,#1a0d08aa)}
.brow .e{font-size:20px;margin-left:-7px;filter:drop-shadow(0 2px 1px #000)}.brow .e:first-child{margin-left:0}
.brow b{margin-left:auto;padding-left:8px;color:#ffffff88;font-size:13px}
#lb,#op{position:fixed;inset:0;background:#000c;z-index:90;display:flex;align-items:center;justify-content:center;padding:10px}
#lbc,#opc{background:linear-gradient(#3a2014,#1a0d08);border:2px solid #9a6a3a;border-radius:10px;padding:14px;width:min(520px,100%);max-height:90vh;overflow:auto}
#lbt{display:flex;gap:4px;margin:8px 0}#lbt .btn{flex:1}.btn.on{box-shadow:0 0 0 2px #fff4}
.lr{display:flex;gap:8px;padding:6px 8px;border-bottom:1px dotted #5a3624;font-size:14px}.lr.me{background:#f5c54222;font-weight:700}.lr span:nth-child(2){flex:1}.lr span:last-child{color:var(--g)}
</style></head><body>

  <div id="band"></div>
  <div id="ctl" style="margin-bottom:70px"><button class="btn" id="lbb">🏆 Ranglisten</button><button class="btn s" id="opb">⚙ Optionen</button></div>
 </div>
 <div class="col" data-t="x" id="cX">

  <div class="box"><h2>Prestige</h2><div id="pre" style="font-size:13px;margin-bottom:8px;line-height:1.6"></div><button class="btn" id="asc">✨ Aufsteigen</button></div>

<script>
"use strict";
const $=id=>document.getElementById(id),KEY="brownieclicker_v1";
const B=[["🥄","Rührlöffel",15,.1],["🍳","Backblech",100,1],["👩‍🍳","Konditor",1100,8],["🔥","Backofen",12e3,47],["🏭","Schoko-Fabrik",13e4,260],["🌴","Kakao-Plantage",14e5,1400],["⛏️","Brownie-Mine",2e7,7800],["⏳","Zeitmaschine",33e7,44e3],["🌀","Portal",51e8,26e4],["⚗️","Alchemie-Labor",75e9,16e5],["🧪","Antimaterie-Ofen",1e12,1e7],["🌈","Prisma-Küche",14e12,65e6],["🎲","Zufalls-Bäckerei",2e14,43e7],["🌌","Idle-Universum",33e14,29e8],["🪐","Brownie-Planet",51e15,21e9],["🌟","Galaxie-Ofen",75e16,15e10]];
const TH=[1,5,10,25,50,75,100,125,150,175,200,250,300,350,400,500];
const U=[];
B.forEach((b,i)=>TH.forEach((t,k)=>U.push({id:"b"+i+"_"+k,ic:b[0],nm:b[1]+" Stufe "+(k+1),ds:b[1]+" produzieren doppelt so viel",cost:b[2]*10*Math.pow(4.2,k),ok:s=>s.own[i]>=t,b:i})));
for(let k=0;k<20;k++){const c=100*Math.pow(10,k);U.push({id:"c"+k,ic:"👆",nm:"Starke Finger "+(k+1),ds:"Klicks sind doppelt so stark",cost:c,ok:s=>s.tot>=c/4,click:1})}
for(let k=0;k<40;k++){const c=1e3*Math.pow(6.5,k);U.push({id:"g"+k,ic:"🍬",nm:"Zuckerguss "+(k+1),ds:"+5% Gesamtproduktion",cost:c,ok:s=>s.tot>=c/4,glob:1})}
const AC=[];
[1,1e3,1e6,1e9,1e12,1e15,1e18,1e21].forEach(v=>AC.push(["🍫","Backe "+f(v)+" Brownies",s=>s.all>=v]));
[1,100,1e3,1e4,1e5].forEach(v=>AC.push(["👆",v+" Klicks",s=>s.clicks>=v]));
B.forEach((b,i)=>[1,50,100].forEach(v=>AC.push([b[0],v+"× "+b[1],s=>s.own[i]>=v])));
[1,7,27,77].forEach(v=>AC.push(["🌟",v+" goldene Brownies",s=>s.gc>=v]));
[1,10,100].forEach(v=>AC.push(["✨",v+" Prestige-Chips",s=>s.chips>=v]));
[10,50,100].forEach(v=>AC.push(["📈",f(v*1e3)+" Brownies/s".replace("1","1"),s=>cps(s)>=v*1e3]));
function f(n){if(n<1e6)return n>=1e3?n.toLocaleString("de-DE",{maximumFractionDigits:0}):(n<10?n.toFixed(1):Math.floor(n)).toString().replace(".",",");const N=["Mio","Mrd","Bio","Brd","Trio","Trd","Quad","Quint","Sext","Sept","Okt","Non","Dez"];let e=Math.min(Math.floor(Math.log10(n)/3)-2,N.length-1);return(n/Math.pow(1e3,e+2)).toFixed(2).replace(".",",")+" "+N[e]}
const fresh=()=>({b:0,tot:0,all:0,clicks:0,own:B.map(_=>0),up:{},ach:{},chips:0,asc:0,gc:0,t:Date.now(),t0:Date.now(),asc0:Date.now(),mute:0,ev:0,pt:0,name:""});
let S=fresh(),buffs=[],dirty=false;
function cost(i,n){return Math.ceil(B[i][2]*Math.pow(1.15,n))}
function mult(s,fr){let m=1+.02*s.chips;U.forEach(u=>{if(s.up[u.id]&&u.glob)m*=1.05});return m}
function cps(s){let t=0;B.forEach((b,i)=>{let m=1;U.forEach(u=>{if(s.up[u.id]&&u.b===i)m*=2});t+=s.own[i]*b[3]*m});t*=mult(s);buffs.forEach(x=>{if(x.k===\"f\")t*=7});return t}
function cpc(s){let m=1;U.forEach(u=>{if(s.up[u.id]&&u.click)m*=2});let c=m*(1+cps(s)*(s.up.c_pct?.01:0));buffs.forEach(x=>{if(x.k===\"k\")c*=777});return c*(1+.02*s.chips)}
let AX=null;function snd(fr,d,ty,v){if(S.mute)return;try{AX=AX||new(window.AudioContext||window.webkitAudioContext)();if(AX.state===\"suspended\")AX.resume();const o=AX.createOscillator(),g=AX.createGain();o.type=ty||\"sine\";o.frequency.value=fr;g.gain.value=Math.max(.0002,(v||.08)*(S.vol==null?1:S.vol));g.gain.exponentialRampToValueAtTime(.0001,AX.currentTime+d);o.connect(g);g.connect(AX.destination);o.start();o.stop(AX.currentTime+d)}catch(e){}}
function toast(t){const e=$("toast");e.textContent=t;e.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>e.style.opacity=0,2600)}
$("brownie").addEventListener("pointerdown",e=>{e.preventDefault();const g=cpc(S);S.b+=g;S.tot+=g;S.all+=g;S.clicks++;dirty=true;snd(180+Math.random()*60,.1,"triangle",.1);
 const st=$("stage").getBoundingClientRect(),x=e.clientX-st.left,y=e.clientY-st.top;
 const p=document.createElement("div");p.className="pop";p.textContent="+"+f(g);p.style.left=(x-14)+"px";p.style.top=(y-20)+"px";$("stage").appendChild(p);setTimeout(()=>p.remove(),1000);
